apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: nginx-space
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80          # The port the service exposes internally
      targetPort: 80    # The port the container is listening on
      nodePort: 30000   # The port mapped to your localhost via kind
